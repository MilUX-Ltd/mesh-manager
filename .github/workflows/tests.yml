# The product's own suites, run on every push and pull request, and weekly. They need no radio,
# no TAK Server and no internet beyond the two libraries below: the gateway is faked in
# tests/fakegw_lib.py and the bridge in tests/fakebridge_lib.py. The suites that exercise the
# release tooling say "skip" out loud when that tooling is not in the tree, which in this
# repository it is not; a skip is never counted as a pass.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]   # the README promises 3.11 or later; the reference kit runs 3.12
    name: suites (python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install what the suites import
        run: |
          python -m pip install --upgrade pip
          python -m pip install "meshtastic==2.7.11" "PyQRCode==1.2.1" "cryptography==43.0.3"
      - name: Run every suite
        run: PYTHON=python3 tests/run.sh
      - name: The same suites over the loopback channel, the one Windows uses (Spec 060)
        if: matrix.python == '3.12'
        env:
          MESH_MANAGER_CHANNEL: tcp
        run: PYTHON=python3 tests/run.sh
