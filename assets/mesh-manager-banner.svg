<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mesh Manager - manage the mesh from the box that carries the radio">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F7F6EB" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#113308"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- the mesh mark: four nodes, every link drawn, the gateway radio at the centre -->
  <g transform="translate(129,105) scale(1.9)">
    <g stroke="#F7F6EB" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M19 25 L81 30 L79 79 L25 83 Z"/>
      <path d="M50 53 L19 25M50 53 L81 30M50 53 L79 79M50 53 L25 83"/>
    </g>
    <g fill="#F7F6EB">
      <circle cx="19" cy="25" r="11"/><circle cx="81" cy="30" r="11"/>
      <circle cx="79" cy="79" r="11"/><circle cx="25" cy="83" r="11"/>
    </g>
    <circle cx="50" cy="53" r="15" fill="#A35C17"/>
  </g>

  <!-- wordmark -->
  <text id="wm" x="363" y="228" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" fill="#F7F6EB" letter-spacing="2">MESH MANAGER</text>

  <!-- tagline -->
  <text id="tl" x="366" y="266" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#B5B171" letter-spacing="0.5">Manage the mesh from the box that carries the radio</text>
</svg>
